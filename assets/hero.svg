<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Vignesh Sankaran. Entrepreneur, Founder, AI and Automation, Technology Builder. Chennai, India.">
<title>Vignesh Sankaran. Entrepreneur, Founder, AI and Automation, Technology Builder. Chennai, India.</title>
<defs>
<linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#FE491C"/><stop offset="1" stop-color="#A40300"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#FE491C" stop-opacity="0.85"/><stop offset="0.35" stop-color="#232327"/><stop offset="1" stop-color="#232327" stop-opacity="0"/></linearGradient>

<radialGradient id="a1" cx="82%" cy="12%" r="55%"><stop offset="0" stop-color="#FE491C" stop-opacity="0.34"/><stop offset="0.5" stop-color="#A40300" stop-opacity="0.12"/><stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/></radialGradient>
<radialGradient id="a2" cx="0%" cy="100%" r="50%"><stop offset="0" stop-color="#A40300" stop-opacity="0.4"/><stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#FE491C"/><stop offset="1" stop-color="#C21A06"/></linearGradient>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .s{font-family:Georgia,'Times New Roman','DejaVu Serif',serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
.rise{animation:rise 1s ease-out backwards}.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.breathe{animation:br 6s ease-in-out infinite}@keyframes br{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="1200" height="520" rx="24" fill="#0A0A0B"/>
<rect width="1200" height="520" rx="24" fill="url(#a1)" class="breathe"/><rect width="1200" height="520" rx="24" fill="url(#a2)"/>
<rect x="16" y="16" width="1168" height="488" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
<circle cx="980" cy="200" r="60" fill="none" stroke="#FE491C" stroke-opacity="0.34"/>
<circle cx="980" cy="200" r="110" fill="none" stroke="#FE491C" stroke-opacity="0.24"/>
<circle cx="980" cy="200" r="165" fill="none" stroke="#FE491C" stroke-opacity="0.16"/>
<circle cx="980" cy="200" r="225" fill="none" stroke="#FE491C" stroke-opacity="0.1"/>
<circle cx="980" cy="200" r="4" fill="#FE491C"/>
