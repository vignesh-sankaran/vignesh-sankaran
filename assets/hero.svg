<text x="68" y="422" class="m" font-size="13" letter-spacing="3.4" fill="#F5EFE6">ENTREPRENEUR   /   FOUNDER   /   AI &amp; AUTOMATION   /   TECHNOLOGY BUILDER</text>
<text x="68" y="458" class="s" font-size="19" font-style="italic" fill="#A39C8E">Building intelligent business systems through AI, automation and software.</text>
