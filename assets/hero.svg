<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Vignesh Sankaran</title>
  <desc id="d">Entrepreneur, Founder, AI and Automation, Technology Builder. Chennai, India.</desc>
  <defs>
    <radialGradient id="glowO" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#FE491C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FE491C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="5%" cy="110%" r="55%">
      <stop offset="0" stop-color="#A40300" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A40300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#FE491C"/>
      <stop offset="1" stop-color="#A40300"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; fill: #F5EFE6; }
      .role { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.5px; fill: #CFC7BA; }
      .loc  { font: 500 16px 'Consolas', 'Courier New', monospace; letter-spacing: 2px; fill: #FE491C; }
      .rise { animation: rise 0.9s ease-out backwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 1010px 80px; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .rise, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#0B0B0C"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowO)" class="pulse"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowR)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#FE491C" stroke-opacity="0.25"/>
  <rect x="70" y="86" width="64" height="5" rx="2.5" fill="url(#bar)" class="rise d1"/>
  <text x="70" y="168" class="name rise d1">VIGNESH SANKARAN</text>
  <text x="70" y="214" class="role rise d2">Entrepreneur  |  Founder  |  AI &amp; Automation  |  Technology Builder</text>
  <text x="70" y="262" class="loc rise d3">CHENNAI, INDIA  /  FOUNDER, VED AUTOMATIONS</text>
</svg>
