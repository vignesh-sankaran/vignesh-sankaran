<g><circle cx="815" cy="200" r="3.5" fill="#F5EFE6" fill-opacity="0.8"/><animateTransform attributeName="transform" type="rotate" from="360 980 200" to="0 980 200" dur="44s" repeatCount="indefinite"/></g>
<g class="rise d1"><circle cx="86" cy="86" r="22" fill="none" stroke="#FE491C" stroke-opacity="0.7"/><text x="86" y="93" text-anchor="middle" class="s" font-size="19" font-style="italic" fill="#F5EFE6">VS</text></g>
<text x="1130" y="91" text-anchor="end" class="m" font-size="12" letter-spacing="3" fill="#6B665C">CHENNAI, INDIA</text>
<text x="64" y="232" class="s rise d1" font-size="112" fill="#F5EFE6" letter-spacing="-2">Vignesh</text>
<text x="64" y="342" class="s rise d2" font-size="112" font-style="italic" fill="url(#nm)" letter-spacing="-2">Sankaran</text>
