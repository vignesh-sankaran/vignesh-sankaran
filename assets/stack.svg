<text x="250" y="83" font-size="16.5" font-weight="500" fill="#F5EFE6" xml:space="preserve">JavaScript<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>TypeScript<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>HTML5<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>CSS3<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>React<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Next.js<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Tailwind CSS<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Node.js</text>
<rect x="0" y="102" width="1200" height="1" fill="#232327"/>
<text x="2" y="138" class="m" font-size="12" letter-spacing="2.4" fill="#A39C8E">AUTOMATION AND AI</text>
<text x="250" y="139" font-size="16.5" font-weight="500" fill="#F5EFE6" xml:space="preserve">n8n<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Zapier<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Pabbly<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>AI agent integrations<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Workflow automation<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Business process automation</text>
<rect x="0" y="158" width="1200" height="1" fill="#232327"/>
