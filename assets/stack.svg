<text x="2" y="274" class="m" font-size="12" letter-spacing="2.4" fill="#A39C8E">CRM AND SYSTEMS</text>
<text x="250" y="275" font-size="16.5" font-weight="500" fill="#D8D1C4" xml:space="preserve">Twenty CRM<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Custom CRM development<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>ERP systems<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Lead management systems</text>
