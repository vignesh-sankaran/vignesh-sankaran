<rect x="0" y="406" width="1200" height="1" fill="#232327"/>
<text x="2" y="442" class="m" font-size="12" letter-spacing="2.4" fill="#A39C8E">ANALYTICS AND SEO</text>
<text x="250" y="443" font-size="16.5" font-weight="500" fill="#D8D1C4" xml:space="preserve">Google Analytics<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Google Tag Manager<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Google Search Console</text>
<rect x="0" y="462" width="1200" height="1" fill="#232327"/>
<text x="2" y="498" class="m" font-size="12" letter-spacing="2.4" fill="#A39C8E">PAYMENTS</text>
<text x="250" y="499" font-size="16.5" font-weight="500" fill="#D8D1C4" xml:space="preserve">Razorpay<tspan fill="#FE491C" fill-opacity="0.8" xml:space="preserve">   /   </tspan>Cashfree</text>
<rect x="0" y="518" width="1200" height="1" fill="#232327"/>
<text x="2" y="556" class="s" font-size="15" font-style="italic" fill="#6B665C">Not every tool is used in every project. Platforms and integrations are used depending on project scope.</text></g>
